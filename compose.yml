# jove-memory
#
# Four containers, one project. Postgres and MinIO publish no host ports:
# they hold the user's memory content and media bytes, and are reachable only
# from inside this network. See docs/SECURITY.md.

name: jove-memory

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: jove-memory-api:dev
    container_name: jove-api
    restart: unless-stopped
    # Runs as the host user rather than as the image's `jove` account, so it can
    # read a credential file that is mode 600 and owned by that user.
    #
    # This overrides `USER jove` in the Dockerfile. The trade is deliberate: the
    # alternative is a credential that has to be group- or world-readable for
    # the container, and loosening a credential's permissions to make a
    # container work is the wrong direction. What the container can reach is
    # bounded by what is mounted, and the only mount here is read-only.
    #
    # Set both from the shell when your ids differ from 1000:1000:
    #   export JOVE_HOST_UID=$(id -u) JOVE_HOST_GID=$(id -g)
    user: "${JOVE_HOST_UID:-1000}:${JOVE_HOST_GID:-1000}"
    ports:
      - "127.0.0.1:8888:8888"
    env_file:
      - .env
    environment:
      # service-to-service DNS names, not localhost
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      # The credential is a file in the user's home directory, mounted
      # read-only. It is never an environment variable here, never in .env, and
      # never in this repository — see docs/OPERATIONS.md.
      #
      # The master key that encrypts credentials saved through the settings
      # form is a *different secret* living somewhere else on purpose: this
      # one is managed by the operator on the host, that one is generated by
      # this process into a volume it owns. Mounting both read-write would
      # have been simpler and wrong — the container genuinely needs to write the
      # master key once, and genuinely must not be able to rewrite the
      # credential it protects.
      OPENROUTER_API_KEY_FILE: /run/secrets/jove/openrouter.key
      JOVE_MASTER_KEY_FILE: /var/lib/jove/keys/master.key
      #
      # The default is the path `npm run key:set` writes to. Override it with
      # JOVE_SECRETS_DIR if you keep credentials elsewhere; nothing in the
      # repository depends on this path existing.
      JOVE_SECRETS_DIR: ${JOVE_SECRETS_DIR:-${HOME}/.config/jove-memory}
    volumes:
      - type: bind
        source: ${JOVE_SECRETS_DIR:-${HOME}/.config/jove-memory}
        target: /run/secrets/jove
        # Read-only. See above.
        read_only: true
      - type: bind
        source: ${JOVE_MASTER_KEY_DIR:-${JOVE_SECRETS_DIR:-${HOME}/.config/jove-memory}/master}
        target: /var/lib/jove/keys
        # Writable, because the master key is generated here on first start.
        #
        # A named volume would have been tidier and does not work: Docker
        # creates one owned by root, and this process runs as the host user,
        # so it cannot write its own key into it. A host directory that
        # `npm run key:set` creates and owns is the arrangement that works
        # without an entrypoint script running as root.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jove

  postgres:
    # pgvector preinstalled. pg_search (ParadeDB) is attempted by the init
    # script; the application detects its absence and falls back to tsvector+GIN.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    container_name: jove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-paradigm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: paradigm
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    # deliberately no ports: this database holds the user's memory content
    networks:
      - jove
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-paradigm} -d paradigm"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: jove-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    # deliberately no ports: media bytes are the user's content
    networks:
      - jove
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  jove:
    driver: bridge

volumes:
  pgdata:
  miniodata:
