api:
  build:
    context: .
    dockerfile: Dockerfile
  image: jove-memory-api:dev
  container_name: jove-api
  restart: unless-stopped
  ports:
    - "127.0.0.1:8888:8888"
  env_file:
    - .env
  environment:
    # service-to-service DNS names, not localhost
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    MINIO_ENDPOINT: minio
    MINIO_PORT: "9000"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  networks:
    - jove

postgres:
  # pgvector preinstalled. pg_search (ParadeDB) is attempted by the init
  # script; the application detects its absence and falls back to tsvector+GIN.
  image: pgvector/pgvector:pg18
  container_name: jove-postgres
  restart: unless-stopped
  environment:
    POSTGRES_USER: ${POSTGRES_SUPERUSER:-paradigm}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: paradigm
  volumes:
    - pgdata:/var/lib/postgresql/18/docker
    - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
  # deliberately no ports: this database holds the user's memory content
  networks:
    - jove
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-paradigm} -d paradigm"]
    interval: 10s
    timeout: 5s
    retries: 5

minio:
  image: minio/minio:latest
  container_name: jove-minio
  restart: unless-stopped
  command: server /data --console-address ":9001"
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  volumes:
    - miniodata:/data
  # deliberately no ports: media bytes are the user's content
  networks:
    - jove
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 10s
    timeout: 5s
    retries: 5

networks:
  jove:
    driver: bridge

volumes:
  pgdata:
  miniodata:
