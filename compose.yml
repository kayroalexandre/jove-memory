# jove-memory

# Phase 4-8: node API, Postgres, MinIO. One compose project, all four containers together.
#
# Ports: only the API is published, bound to localhost.
# Postgres and MinIO publish nothing — reachable only inside this network.

name: jove-memory

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jove-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    env_file:
      - .env
    environment:
      # service-to-service DNS names, not localhost
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jove
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8888/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    # pgvector preinstalled. pg_search (ParadeDB) is added by the init script;
    # the app falls back to tsvector+GIN if it is unavailable.
    image: pgvector/pgvector:pg18
    container_name: jove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-paradigm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: paradigm
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    # deliberately no ports: this database holds the user's memory content
    networks:
      - jove
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-paradigm} -d paradigm"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: jove-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    # deliberately no ports: media bytes are the user's content
    networks:
      - jove
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  jove:
    driver: bridge

volumes:
  pgdata:
  miniodata:
